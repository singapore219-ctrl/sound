<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sound · YouTube 음성 → 텍스트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="shell">
    <header class="hero">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="23" />
          <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
        <span>sound</span>
      </div>
      <h1>유튜브 영상을 <span class="grad">텍스트</span>로</h1>
      <p class="subtitle">오디오·영상 파일을 올리면 모든 말을 받아써 드립니다. 자동 언어 감지 · 자막/JSON 출력</p>
    </header>

    <section class="card">
      <form id="form" autocomplete="off">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-mode="upload">파일 업로드</button>
          <button type="button" class="tab" data-mode="youtube">유튜브 링크</button>
        </div>

        <div class="panel" data-panel="upload">
          <label id="dropzone" class="dropzone">
            <input id="file" type="file" accept="audio/*,video/*" hidden />
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            <span class="dz-title">탭해서 오디오·영상 파일을 선택하세요</span>
            <span class="dz-hint">휴대폰의 녹음·동영상 파일 가능 · mp3 · m4a · wav · mp4 · webm …</span>
          </label>
          <div id="file-info" class="file-info" hidden></div>
        </div>

        <div class="panel" data-panel="youtube" hidden>
          <div class="input-wrap">
            <svg class="link-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
            <input
              id="url"
              type="text"
              placeholder="https://www.youtube.com/watch?v=..."
            />
          </div>
          <p class="panel-note">⚠ 이 서버에서는 유튜브 접근이 막혀 실패할 수 있어요. 안 되면 위 “파일 업로드”를 사용하세요.</p>
        </div>

        <details class="options">
          <summary>고급 옵션</summary>
          <div class="options-grid">
            <label>
              <span>모델</span>
              <select id="model">
                <option value="tiny">tiny · 가장 빠름</option>
                <option value="base" selected>base · 기본</option>
                <option value="small">small</option>
                <option value="medium">medium · 정확</option>
                <option value="large-v3">large-v3 · 최고 정확</option>
              </select>
            </label>
            <label>
              <span>언어</span>
              <select id="language">
                <option value="" selected>자동 감지</option>
                <option value="ko">한국어</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="zh">中文</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
              </select>
            </label>
            <label>
              <span>장치</span>
              <select id="device">
                <option value="auto" selected>auto</option>
                <option value="cpu">cpu</option>
                <option value="cuda">cuda (GPU)</option>
              </select>
            </label>
            <fieldset class="formats">
              <span>출력 형식</span>
              <div class="chips">
                <label class="chip"><input type="checkbox" value="srt" checked /><span>SRT</span></label>
                <label class="chip"><input type="checkbox" value="vtt" checked /><span>VTT</span></label>
                <label class="chip"><input type="checkbox" value="json" checked /><span>JSON</span></label>
                <label class="chip"><input type="checkbox" value="txt" checked /><span>TXT</span></label>
              </div>
            </fieldset>
          </div>
        </details>

        <button id="submit" type="submit" class="btn-primary btn-block">
          <span class="btn-label">받아쓰기 시작</span>
          <span class="spinner" hidden></span>
        </button>
      </form>
    </section>

    <section id="result" class="result" hidden>
      <div class="status-bar">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">대기 중</span>
        <div id="meta" class="meta"></div>
      </div>

      <div id="transcript" class="transcript" aria-live="polite"></div>

      <div id="downloads" class="downloads" hidden>
        <span class="dl-label">다운로드</span>
        <div id="dl-buttons" class="dl-buttons"></div>
      </div>
    </section>

    <footer class="foot">
      로컬에서 동작합니다 · 권한이 있는 영상에만 사용하세요
    </footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
